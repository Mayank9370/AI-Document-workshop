services:
  # ==========================================
  # Redis - In-Memory Cache & Message Broker
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: ai-workspace-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - ai-workspace-net

  # ==========================================
  # Qdrant - Vector Database for RAG
  # ==========================================
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: ai-workspace-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - ai-workspace-net

  # ==========================================
  # Backend API - Node.js Express REST API
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-workspace-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:3000
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-workspace-net

  # ==========================================
  # Frontend - Next.js App Router Application
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-workspace-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - ai-workspace-net

# ==========================================
# Persistent Storage Volumes
# ==========================================
volumes:
  redis_data:
    driver: local
  qdrant_data:
    driver: local

# ==========================================
# Network Configuration
# ==========================================
networks:
  ai-workspace-net:
    driver: bridge
